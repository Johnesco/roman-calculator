<!doctype html>
<html lang="la">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator Romanus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #e9e2d3;
  --bg2: #d6ccb6;
  --body: #f6f1e6;
  --edge: #b9ab8c;
  --ink: #2b2318;
  --key: #fbf8f1;
  --key-shadow: #c9bc9f;
  --op: #7a1f1f;
  --op-ink: #f7e9d7;
  --fn: #ddd2bb;
  --gold: #b08a3e;
  --screen: #1f2a1f;
  --screen-ink: #e8d9a8;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17140f;
    --bg2: #0e0c09;
    --body: #2a251d;
    --edge: #4a4130;
    --ink: #f0e6d0;
    --key: #3a3328;
    --key-shadow: #1b1711;
    --op: #8f2a24;
    --op-ink: #fbeedd;
    --fn: #4a4234;
    --screen: #0d120d;
  }
}
:root[data-theme="dark"] {
  --bg: #17140f;
  --bg2: #0e0c09;
  --body: #2a251d;
  --edge: #4a4130;
  --ink: #f0e6d0;
  --key: #3a3328;
  --key-shadow: #1b1711;
  --op: #8f2a24;
  --op-ink: #fbeedd;
  --fn: #4a4234;
  --screen: #0d120d;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  background: radial-gradient(circle at 30% 20%, var(--bg), var(--bg2));
  color: var(--ink);
  font-family: "Cinzel", "Times New Roman", serif;
}

.calc {
  width: 100%;
  max-width: 360px;
  padding: 22px;
  border-radius: 22px;
  background: var(--body);
  border: 2px solid var(--edge);
  box-shadow:
    0 0 0 6px var(--body),
    0 0 0 8px var(--gold),
    0 24px 50px rgba(0, 0, 0, .35);
}

.display {
  background: var(--screen);
  color: var(--screen-ink);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 20px;
  min-height: 104px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  box-shadow: inset 0 3px 10px rgba(0, 0, 0, .6);
  overflow: hidden;
}

.expr {
  min-height: 1.3em;
  font-size: 15px;
  opacity: .65;
  letter-spacing: .08em;
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: right;
}

.value {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .06em;
  line-height: 1.25;
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: right;
}
.value.long { font-size: 24px; }
.value.xlong { font-size: 17px; letter-spacing: .02em; }
.value.err { color: #ff9b85; }

.vinc {
  text-decoration: overline;
  text-decoration-thickness: 2px;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  font: inherit;
  font-size: 22px;
  font-weight: 700;
  aspect-ratio: 1.15;
  border: none;
  border-radius: 12px;
  background: var(--key);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--key-shadow);
  cursor: pointer;
  transition: transform .05s, box-shadow .05s, filter .15s;
  -webkit-tap-highlight-color: transparent;
}
button:hover { filter: brightness(1.05); }
button:active, button.pressed {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--key-shadow);
}
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.op { background: var(--op); color: var(--op-ink); }
.op.active { outline: 3px solid var(--gold); outline-offset: -3px; }
.fn { background: var(--fn); }
.eq {
  grid-column: 1 / -1;
  aspect-ratio: auto;
  padding: 14px 0;
  background: var(--gold);
  color: #241a08;
  box-shadow: 0 4px 0 #7d6127;
}
.eq:active { box-shadow: 0 1px 0 #7d6127; }

/* pocket-calculator details */
.brand {
  display: flex; align-items: center; justify-content: space-between;
  margin: -4px 2px 14px;
}
.brand .name { font-size: 13px; letter-spacing: .3em; color: var(--gold); font-weight: 700; }
.solar { display: grid; grid-template-columns: repeat(4, 16px); gap: 2px; padding: 3px;
  background: #1a1410; border-radius: 4px; }
.solar span { height: 16px; background: linear-gradient(160deg, #4a3826, #24190f); border-radius: 1px; }
.op, .fn, .eq { font-size: 28px; }
</style>
</head>
<body>
  <main class="calc" aria-label="Roman numeral calculator">
    <div class="brand" aria-hidden="true">
      <span class="name">CALCVLATOR</span>
      <span class="solar"><span></span><span></span><span></span><span></span></span>
    </div>
    <div class="display" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">N</div>
    </div>

    <div class="keys">
      <button data-d="M" aria-label="M, one thousand">M</button>
      <button data-d="D" aria-label="D, five hundred">D</button>
      <button data-d="C" aria-label="C, one hundred">C</button>
      <button class="op" data-op="÷" aria-label="divide">÷</button>

      <button data-d="L" aria-label="L, fifty">L</button>
      <button data-d="X" aria-label="X, ten">X</button>
      <button data-d="V" aria-label="V, five">V</button>
      <button class="op" data-op="×" aria-label="multiply">×</button>

      <button data-d="I" aria-label="I, one">I</button>
      <button data-d="S" aria-label="S, one half (semis)">S</button>
      <button data-d="·" aria-label="dot, one twelfth (uncia)">·</button>
      <button class="op" data-op="−" aria-label="subtract">−</button>

      <button data-d="N" aria-label="N, zero (nulla)">N</button>
      <button class="fn" data-fn="clear" aria-label="clear all">↺</button>
      <button class="fn" data-fn="back" aria-label="delete last">⌫</button>
      <button class="op" data-op="+" aria-label="add">+</button>

      <button class="eq" data-fn="eq" aria-label="equals">=</button>
    </div>
  </main>

  <script src="script.js?v=3"></script>
</body>
</html>
